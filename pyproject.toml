[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gbx-codecs"
version = "0.1.1"
description = "Audio codecs for speech models served by gbx-lm, run as a companion process on Apple silicon and NVIDIA GPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.10"
authors = [{ name = "GreenBitAI" }]
dependencies = ["mlx>=0.29", "numpy>=1.24"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/GreenBitAI/gbx-codecs"

[project.scripts]
gbx-codecs = "gbx_codecs.__main__:main"

[project.optional-dependencies]
formats = ["miniaudio>=1.59"]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/gbx_codecs"]

[tool.ruff]
line-length = 110
# Ported as upstream wrote it, so the two can be diffed.
extend-exclude = ["src/gbx_codecs/fish_s1/dac.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
