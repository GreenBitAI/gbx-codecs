name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]" "ruff==0.17.3"
      - run: ruff check . && ruff format --check .
      - run: pytest -q tests
